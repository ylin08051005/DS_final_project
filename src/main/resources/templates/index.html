<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coffee Search Engine</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6F4E37;
            --secondary-color: #A67B5B;
            --accent-color: #2C3E50;
            --bg-color: #F4F6F9;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 2.2rem;
        }

        /* 搜尋類型 Tab */
        .search-type-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 20px;
            border: 2px solid #eee;
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
        }

        button.search-btn {
            min-width: 100px;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        /* 結果列表 (Web/PDF) */
        .result-list {
            display: grid;
            gap: 15px;
        }

        .result-card {
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.1rem;
            display: block;
        }

        .score-badge {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 60px;
            text-align: center;
        }
        
        /* 圖片網格佈局 */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        
        .image-card {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #eee;
            transition: transform 0.2s;
        }
        
        .image-card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .image-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }
        
        .image-card .info {
            padding: 10px;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading { text-align: center; padding: 20px; color: var(--secondary-color); }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px; height: 36px; border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>☕ Coffee Search Engine</h2>

    <div class="search-type-tabs">
        <div class="tab-btn active" onclick="setSearchType('web', this)">🌐 全部</div>
        <div class="tab-btn" onclick="setSearchType('image', this)">🖼️ 圖片</div>
        <div class="tab-btn" onclick="setSearchType('pdf', this)">📄 PDF</div>
    </div>

    <div class="search-box">
        <input type="text" id="apiInput" placeholder="輸入關鍵字 (例如: 拿鐵, 烘焙)..." autofocus />
        <button class="search-btn" onclick="callGoogleApi()">搜尋</button>
    </div>

    <div id="apiResult"></div>
</div>

<script>
    let currentSearchType = 'web';

    function setSearchType(type, btn) {
        currentSearchType = type;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // 如果輸入框有值，直接觸發搜尋
        if(document.getElementById('apiInput').value.trim() !== "") {
            callGoogleApi();
        }
    }

    function callGoogleApi() {
        const query = document.getElementById('apiInput').value;
        const resultContainer = document.getElementById('apiResult');

        if (!query) { alert('請輸入搜尋內容！'); return; }

        resultContainer.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <div>正在進行 ${currentSearchType === 'image' ? '圖片' : '智慧'} 搜尋...</div>
            </div>`;

        const params = new URLSearchParams();
        params.append('apiInput', query);
        params.append('searchType', currentSearchType);

        fetch('/api/coffee_search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        })
        .then(response => response.json())
        .then(response => {
            resultContainer.innerHTML = '';
            
            // 後端回傳格式: { type: "web", data: [...] }
            const type = response.type;
            const data = response.data;

            if (!data || data.length === 0) {
                resultContainer.innerHTML = '<p style="text-align:center; color:#666;">找不到相關結果。</p>';
                return;
            }

            // 根據類型選擇渲染模式
            if (type === 'image') {
                renderImages(data, resultContainer);
            } else {
                renderList(data, resultContainer, type === 'pdf');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            resultContainer.innerHTML = '<div style="text-align:center;">發生錯誤，請稍後再試。</div>';
        });
    }

    function renderImages(data, container) {
        const grid = document.createElement('div');
        grid.className = 'image-grid';
        data.forEach(item => {
            grid.innerHTML += `
                <div class="image-card">
                    <a href="${item.link}" target="_blank">
                        <img src="${item.thumbnailLink || 'https://via.placeholder.com/150'}" alt="${item.title}">
                    </a>
                    <div class="info">${item.title}</div>
                </div>
            `;
        });
        container.appendChild(grid);
    }

    function renderList(data, container, isPdf) {
        const ul = document.createElement('div');
        ul.className = 'result-list';
        data.forEach(item => {
            const scoreDisplay = typeof item.score === 'number' ? item.score.toFixed(2) : item.score;
            ul.innerHTML += `
                <div class="result-card">
                    <div class="result-content">
                        <a href="${item.link}" target="_blank" class="result-link">
                            ${isPdf ? '📄 ' : ''} ${item.title}
                        </a>
                        <span class="result-url" style="color:#888; font-size:0.85rem;">${item.link}</span>
                        ${!isPdf ? `<div style="font-size:0.9rem; color:#555; margin-top:5px;">${item.snippet}</div>` : ''}
                    </div>
                    <div class="score-badge">
                        <div style="font-size:0.7rem;">Score</div>
                        ${scoreDisplay}
                    </div>
                </div>
            `;
        });
        container.appendChild(ul);
    }
    
    document.getElementById("apiInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") callGoogleApi();
    });
</script>
</body>
</html>
